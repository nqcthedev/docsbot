name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (embedded PGlite)
        run: pnpm test
      - name: Unit tests (real Postgres + pgvector)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Migrations apply cleanly on Postgres
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: pnpm build
      - name: Build Docker migration bundle
        run: pnpm build:migrate

  live:
    # Integration + end-to-end tests call a real AI provider; they run only when a key is configured.
    name: Integration & e2e (live AI)
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'push' }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for provider key
        id: key
        run: echo "present=${{ env.GEMINI_API_KEY != '' || env.OPENAI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        run: pnpm test:integration
      - if: steps.key.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.key.outputs.present == 'true'
        run: pnpm build && pnpm test:e2e
